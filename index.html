<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carreras</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#0ff;
      --secondary:#f0f;
      --accent:#ff0077;
      --bg-dark:#0a0a0f;
      --white:#fff;
      --muted:#888;
      --footer-height:64px;
    }
    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:'Inter',sans-serif;
      background:radial-gradient(circle at top left,#ff00a8,#440047,#0a0a0f);
      color:var(--white);
      min-height:100vh;
      overflow-x:hidden;
      padding-bottom:var(--footer-height);
    }

    /* Fondo con video */
    .video-card {
      position:fixed;
      inset:0;
      width:100%; height:100%;
      overflow:hidden;
      z-index:1;
      pointer-events:none;
    }
    .video-card video {
      position:absolute;
      top:50%; left:50%;
      width:100%; height:100%;
      transform:translate(-50%,-50%);
      object-fit:cover;
    }
    .video-card::after {
      content:'';
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.45);
      backdrop-filter:brightness(0.7) blur(1px);
      z-index:2;
    }

    /* Header */
    header {
      position:fixed;
      top:0; left:0; right:0;
      background:rgba(10,10,15,0.6);
      padding:16px 0;
      backdrop-filter:blur(8px);
      box-shadow:0 0 15px rgba(0,255,255,0.3);
      z-index:1000;
    }
    nav {
      display:flex;
      justify-content:center;
      gap:80px;
    }
    nav a {
      text-decoration:none;
      font-family:'Orbitron',sans-serif;
      color:var(--white);
      text-transform:uppercase;
      letter-spacing:2px;
      padding-top:10px;
    }
    nav a.active {
      color:var(--primary);
      font-weight:700;
    }

    /* Contenido principal */
    main.site {
      position:relative;
      z-index:3;
      text-align:center;
      max-width:900px;
      margin:0 auto;
      padding:140px 20px;
      min-height:calc(100vh - 160px);
    }
    h1 {
      font-family:'Orbitron',sans-serif;
      font-size:4.5rem;
      margin:10px 0 50px;
      color:var(--primary);
      text-shadow:0 0 10px var(--primary),0 0 25px var(--secondary);
      animation:glow 2s infinite alternate;
    }
    p {
      font-size:1.1rem;
      max-width:700px;
      margin:0 auto 40px;
      line-height:1.6;
    }
    .btn {
      margin:12px 8px;
      padding:12px 22px;
      border:none;
      font-family:'Orbitron',sans-serif;
      cursor:pointer;
    }
    .btn.play {
      background:var(--primary);
      color:#000;
      box-shadow:0 0 15px var(--primary);
    }

    /* Footer */
    footer {
      position:fixed;
      left:0; right:0; bottom:0;
      height:var(--footer-height);
      background:rgba(10,10,15,0.92);
      padding:10px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      z-index:1000;
      font-family:'Orbitron',sans-serif;
      color:var(--primary);
      box-shadow:0 -2px 14px rgba(0,255,255,0.06);
      backdrop-filter:blur(6px);
    }
    .footer-left, .footer-center, .footer-right {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .footer-left p {
      margin:0;
      font-size:0.92rem;
      color:var(--muted);
    }
    .footer-meta {
      font-size:0.72rem;
      color:var(--muted);
      margin-left:6px;
    }
    .footer-center .footer-nav {
      display:flex;
      gap:14px;
    }
    .footer-center .footer-nav a {
      color:var(--white);
      text-decoration:none;
      font-size:0.86rem;
      padding:6px 8px;
      border-radius:6px;
      transition:background .18s,color .18s,transform .12s;
    }
    .footer-center .footer-nav a:hover {
      background:rgba(255,255,255,0.04);
      color:var(--primary);
      transform:translateY(-2px);
    }
    .social-icons {
      display:flex;
      gap:12px;
    }
    .social-icons img {
      width:28px; height:28px;
      display:block;
      filter:drop-shadow(0 0 3px rgba(0,255,255,0.15));
      transition:transform .18s,filter .18s;
    }
    .social-icons a:hover img {
      transform:scale(1.12);
      filter:drop-shadow(0 0 8px var(--primary));
    }

    /* Animación */
    @keyframes glow {
      from { text-shadow:0 0 10px var(--primary),0 0 20px var(--secondary); }
      to   { text-shadow:0 0 20px var(--secondary),0 0 40px var(--accent); }
    }

    /* Responsive */
    @media (max-width:768px) {
      footer { display:none; }
      body   { padding-bottom:0; }
      h1     { font-size:2.8rem; }
      nav    { gap:30px; }
    }

    /* Orientación móvil (forzar horizontal) */
    @media (orientation:portrait) and (max-width:768px) {
      main.site, header, footer { display:none; }
      body::before {
        content:"⚠️ Por favor, gira tu dispositivo para una mejor experiencia (vista horizontal)";
        position:fixed;
        inset:0;
        background:var(--bg-dark);
        color:var(--primary);
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        font-size:1.2rem;
        padding:20px;
        z-index:9999;
        font-family:'Orbitron',sans-serif;
        text-shadow:0 0 5px rgba(0,255,255,0.5);
      }
    }
  </style>
</head>
<body>

  <!-- Fondo con video -->
  <div class="video-card" aria-hidden="true">
    <video autoplay muted loop playsinline>
      <source src="./vid/video.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Header -->
  <header>
    <nav>
      <a href="index.html" class="active">Inicio</a>
      <a href="vehiculos.html">Vehículos</a>
      <a href="circuitos.html">Circuitos</a>
    </nav>
  </header>

  <!-- Contenido -->
  <main class="site">
    <h1>NEON RUSH</h1>
    <p>Carreras de alta velocidad en paisajes futuristas. Personaliza tu vehículo y compite en circuitos extremos.</p>
    <button class="btn play" onclick="window.location.href='vehiculos.html'">▶ Jugar Ahora</button>
  </main>

  <!-- Footer -->
  <footer role="contentinfo">
    <div class="footer-left">
      <p>© 2025 Neon Rush</p><span class="footer-meta">v1.0</span>
    </div>
    <div class="footer-center">
      <nav class="footer-nav">
        <a href="/terms.html">Términos</a>
        <a href="/privacy.html">Privacidad</a>
        <a href="/contacto.html">Contacto</a>
      </nav>
    </div>
    <div class="footer-right">
      <div class="social-icons">
        <a href="https://discord.com" target="_blank" aria-label="Discord">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtAEfSw-2sMgXfXJxVQ0AATc2QJ6TBd1nRnA&s" alt="Discord">
        </a>
        <a href="https://twitter.com" target="_blank" aria-label="X">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfxRWfQXLI0gkv7sdl2y5vRwPUIvlZOAgCcA&s" alt="X">
        </a>
        <a href="https://reddit.com" target="_blank" aria-label="Reddit">
          <img src="./img/reddit.png" alt="Reddit">
        </a>
      </div>
    </div>
  </footer>

</body>
</html>
